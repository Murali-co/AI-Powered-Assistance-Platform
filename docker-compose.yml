services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-powered-assistance-platform-backend:latest
    container_name: ai-powered-assistance-platform-backend
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - chromadb
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    image: ai-powered-assistance-platform-worker:latest
    container_name: ai-powered-assistance-platform-worker
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    command: ["python", "-m", "app.jobs.scheduler"]
    depends_on:
      - backend
      - chromadb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: ai-powered-assistance-platform-frontend:latest
    container_name: ai-powered-assistance-platform-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: ai-powered-assistance-platform-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  chroma_data:
